services:
  edulens-backend:
    container_name: edulens-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      # Ánh xạ trực tiếp các biến đúng với Spring property trong application.yml
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - PORT=${PORT:-8080}
    deploy:
      resources:
        limits:
          memory: 768M