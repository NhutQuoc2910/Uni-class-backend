spring:
  application:
    name: edulens-backend

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  datasource:
    # Hỗ trợ cả SPRING_DATASOURCE_URL, DB_JDBC_URL (midterm_plan) và DB_URL
    url: ${SPRING_DATASOURCE_URL:${DB_JDBC_URL:${DB_URL:jdbc:postgresql://localhost:5432/edulens}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
      data-source-properties:
        prepareThreshold: 0 # Tránh lỗi PgBouncer khi dùng Supabase Pooler

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # Hỗ trợ cả MAIL_USERNAME và GMAIL_USERNAME (midterm_plan)
    username: ${MAIL_USERNAME:${GMAIL_USERNAME:}}
    password: ${MAIL_PASSWORD:${GMAIL_APP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

# JWT configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
  otp-expiration-minutes: 5

# Firebase configuration
firebase:
  config-path: ${FIREBASE_CONFIG_PATH:firebase-service-account.json}

# Storage configuration
storage:
  supabase:
    url: ${SUPABASE_URL:}
    key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:uniclass-files}
  local-dir: ${STORAGE_LOCAL_DIR:uploads}

# Application feature flags & configuration
app:
  attendance:
    allow-demo-bypass: ${ALLOW_DEMO_BYPASS:false}
  demo:
    seed-enabled: ${SEED_DEMO_DATA:false}

# Swagger UI / OpenAPI configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
